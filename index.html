<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Quick notes, organised by category.</p>
  </header>
 
  <main>
    <section id="add-note-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note text</label>
        <input type="text" id="note-input" name="note-input">
 
        <label for="note-category">Category</label>
        <select id="note-category" name="note-category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>
 
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>
 
    <section id="notes-section">
      <h2>Your notes</h2>
      <input type="search" id="search-input" placeholder="Search notes...">
      <button type="button" id="clear-all-btn">Clear all</button>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>
 
  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
